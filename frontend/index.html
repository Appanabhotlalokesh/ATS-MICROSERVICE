<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ATS Microservice Dashboard</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header>
      <h1>ATS Microservice Dashboard</h1>
      <p>Use this page to view Zoho job openings and submit candidate applications.</p>
    </header>

    <main>
      <section class="panel">
        <div class="panel-header">
          <h2>Open Jobs</h2>
          <button id="refreshJobs" type="button">Refresh</button>
        </div>
        <div id="jobStatus" class="status">Loading jobs...</div>
        <ul id="jobList" class="job-list"></ul>
      </section>

      <section class="panel">
        <div class="panel-header">
          <h2>Create Candidate</h2>
        </div>
        <form id="candidateForm" class="form-grid">
          <label>
            Name
            <input type="text" id="name" required placeholder="Alice" />
          </label>
          <label>
            Email
            <input type="email" id="email" required placeholder="alice@example.com" />
          </label>
          <label>
            Phone
            <input type="tel" id="phone" required placeholder="1234567890" />
          </label>
          <button type="submit">Submit Candidate</button>
        </form>
        <div id="formMessage" class="message"></div>
      </section>
    </main>

    <footer>
      <p>Backend endpoints should be running locally via <code>serverless offline</code>.</p>
      <p>Open <code>frontend/index.html</code> in the browser to use this UI.</p>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
